# Google Cloud Run service for the OnCUE LiteLLM proxy.
#
# Deploy (one-time setup):
#   gcloud auth login
#   gcloud config set project YOUR_PROJECT_ID
#   gcloud services enable run.googleapis.com artifactregistry.googleapis.com cloudbuild.googleapis.com
#   gcloud artifacts repositories create oncue --repository-format=docker --location=asia-south1
#
# Build + deploy:
#   gcloud builds submit --tag asia-south1-docker.pkg.dev/YOUR_PROJECT_ID/oncue/litellm:latest backend/
#   gcloud run deploy oncue-litellm \
#     --image asia-south1-docker.pkg.dev/YOUR_PROJECT_ID/oncue/litellm:latest \
#     --region asia-south1 \
#     --platform managed \
#     --allow-unauthenticated \
#     --port 4000 \
#     --set-env-vars "LITELLM_MASTER_KEY=sk-master-..." \
#     --set-secrets "GROQ_API_KEY=groq-api-key:latest,GOOGLE_API_KEY=google-api-key:latest,DATABASE_URL=litellm-database-url:latest"
#
# Store secrets first:
#   echo -n "gsk_..." | gcloud secrets create groq-api-key --data-file=-
#   echo -n "AIza..." | gcloud secrets create google-api-key --data-file=-
#   echo -n "postgresql://..." | gcloud secrets create litellm-database-url --data-file=-

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: oncue-litellm
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/oncue/litellm:latest
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: latest
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: groq-api-key
                  key: latest
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: google-api-key
                  key: latest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-database-url
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
