# Render Blueprint for the OnCUE webapp (Reflex + payments).
# In Render: New + → Blueprint → connect this repo. Render builds the image
# from webapp/Dockerfile (you never build or upload an image yourself).
# Fill the values marked "sync: false" in the Render dashboard after import.

services:
  - type: web
    name: oncue-webapp
    runtime: docker
    rootDir: webapp
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ping
    plan: starter
    envVars:
      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_FUNCTIONS_URL
        sync: false
      - key: EMBED_SECRET
        sync: false
      # LiteLLM proxy (deployed separately via backend/render.yaml)
      - key: LITELLM_URL
        sync: false
      - key: LITELLM_MASTER_KEY
        sync: false
      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      # Razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_ID_PRO
        sync: false
